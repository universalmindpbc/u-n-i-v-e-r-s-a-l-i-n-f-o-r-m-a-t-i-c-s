<svg id="sound-diagram" viewBox="0 0 720 510" role="img" aria-labelledby="sound-svg-title sound-svg-desc" data-view="chromatic" data-progress="1.0000" data-playing="false" data-chromatic-layout="wide" xmlns="http://www.w3.org/2000/svg" width="720" height="510"><rect x="0" y="0" width="720" height="510" fill="#05090c"/><title id="sound-svg-title">The chromatic octave: twelve pitch classes and thirteen keys</title><desc id="sound-svg-desc">Twelve equal-tempered pitch classes run clockwise from C. The keyboard spans C to C: five black keys in groups of two and three, and eight white keys including the repeated upper C. These counts form a Fibonacci counting pattern, not a derivation of chromatic tuning.</desc><text x="360" y="24" fill="#e5edf2" font-size="17" text-anchor="middle" style="text-anchor: middle;">12 pitch classes · 13 keys from C to C</text><circle cx="176" cy="215" r="128" fill="none" stroke="#30424e" stroke-width="0.7"/><path d="M 176,87 A 128,128 0 1 1 176,343 A 128,128 0 1 1 176,87" fill="none" stroke="#5ca8ff" stroke-width="1.6" data-chromatic-path="true" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/><circle cx="176" cy="87" r="4.5" fill="#62d998" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="0" data-note="C" data-key-color="white"/><text x="176" y="62" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">C</text><circle cx="240" cy="104.14874831559185" r="3" fill="#ff84c5" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-pitch="1" data-note="C♯" data-key-color="black"/><text x="252.5" y="82.49811322098088" fill="#ff84c5" font-size="17" text-anchor="middle" opacity="1" style="text-anchor: middle;">C♯</text><circle cx="286.8512516844081" cy="151" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="2" data-note="D" data-key-color="white"/><text x="308.5018867790191" y="138.5" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">D</text><circle cx="304" cy="215" r="3" fill="#ff84c5" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-pitch="3" data-note="D♯" data-key-color="black"/><text x="329" y="215" fill="#ff84c5" font-size="17" text-anchor="middle" opacity="1" style="text-anchor: middle;">D♯</text><circle cx="286.85125168440817" cy="279" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="4" data-note="E" data-key-color="white"/><text x="308.5018867790191" y="291.5" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">E</text><circle cx="240" cy="325.85125168440817" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="5" data-note="F" data-key-color="white"/><text x="252.5" y="347.5018867790191" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">F</text><circle cx="176.00000000000003" cy="343" r="3" fill="#ff84c5" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-pitch="6" data-note="F♯" data-key-color="black"/><text x="176.00000000000003" y="368" fill="#ff84c5" font-size="17" text-anchor="middle" opacity="1" style="text-anchor: middle;">F♯</text><circle cx="112.00000000000003" cy="325.85125168440817" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="7" data-note="G" data-key-color="white"/><text x="99.50000000000004" y="347.5018867790192" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">G</text><circle cx="65.14874831559189" cy="279.00000000000006" r="3" fill="#ff84c5" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-pitch="8" data-note="G♯" data-key-color="black"/><text x="43.49811322098094" y="291.50000000000006" fill="#ff84c5" font-size="17" text-anchor="middle" opacity="1" style="text-anchor: middle;">G♯</text><circle cx="48" cy="215.00000000000003" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="9" data-note="A" data-key-color="white"/><text x="23" y="215.00000000000003" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">A</text><circle cx="65.14874831559186" cy="151" r="3" fill="#ff84c5" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-pitch="10" data-note="A♯" data-key-color="black"/><text x="43.49811322098088" y="138.5" fill="#ff84c5" font-size="17" text-anchor="middle" opacity="1" style="text-anchor: middle;">A♯</text><circle cx="111.99999999999994" cy="104.14874831559189" r="3" fill="#e5edf2" stroke="#e5edf2" stroke-width="1" opacity="1" data-chromatic-pitch="11" data-note="B" data-key-color="white"/><text x="99.49999999999993" y="82.49811322098094" fill="#e5edf2" font-size="20" text-anchor="middle" opacity="1" style="text-anchor: middle;">B</text><text x="176" y="203" fill="#e5edf2" font-size="47" text-anchor="middle" style="text-anchor: middle;">12</text><text x="176" y="242" fill="#859aa8" font-size="13" text-anchor="middle" style="text-anchor: middle;">pitch classes</text><text x="176" y="405" fill="#e5edf2" font-size="15" text-anchor="middle" style="text-anchor: middle;">7 natural + 5 altered</text><text x="176" y="431" fill="#859aa8" font-size="11" text-anchor="middle" style="text-anchor: middle;">12 equal semitone steps</text><rect x="366" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="0" data-note="C" data-key-color="white" data-active="false"/><text x="385.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">C</text><rect x="407" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="2" data-note="D" data-key-color="white" data-active="false"/><text x="426.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">D</text><rect x="448" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="4" data-note="E" data-key-color="white" data-active="false"/><text x="467.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">E</text><rect x="489" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="5" data-note="F" data-key-color="white" data-active="false"/><text x="508.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">F</text><rect x="530" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="7" data-note="G" data-key-color="white" data-active="false"/><text x="549.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">G</text><rect x="571" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="9" data-note="A" data-key-color="white" data-active="false"/><text x="590.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">A</text><rect x="612" y="187" width="39" height="124" fill="#ffffff06" stroke="#30424e" stroke-width="1" data-chromatic-key="11" data-note="B" data-key-color="white" data-active="false"/><text x="631.5" y="287" fill="#e5edf2" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">B</text><rect x="653" y="187" width="39" height="124" fill="#62d99824" stroke="#62d998" stroke-width="1.3" data-chromatic-key="12" data-note="C" data-key-color="white" data-active="true"/><text x="672.5" y="287" fill="#62d998" font-size="19" text-anchor="middle" opacity="1" style="text-anchor: middle;">C</text><rect x="395.52" y="187" width="22.96" height="73" fill="#03070a" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-key="1" data-note="C♯" data-key-color="black" data-active="false"/><text x="407" y="231" fill="#ff84c5" font-size="14" text-anchor="middle" opacity="1" style="text-anchor: middle;">C♯</text><rect x="436.52" y="187" width="22.96" height="73" fill="#03070a" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-key="3" data-note="D♯" data-key-color="black" data-active="false"/><text x="448" y="231" fill="#ff84c5" font-size="14" text-anchor="middle" opacity="1" style="text-anchor: middle;">D♯</text><rect x="518.52" y="187" width="22.96" height="73" fill="#03070a" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-key="6" data-note="F♯" data-key-color="black" data-active="false"/><text x="530" y="231" fill="#ff84c5" font-size="14" text-anchor="middle" opacity="1" style="text-anchor: middle;">F♯</text><rect x="559.52" y="187" width="22.96" height="73" fill="#03070a" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-key="8" data-note="G♯" data-key-color="black" data-active="false"/><text x="571" y="231" fill="#ff84c5" font-size="14" text-anchor="middle" opacity="1" style="text-anchor: middle;">G♯</text><rect x="600.52" y="187" width="22.96" height="73" fill="#03070a" stroke="#ff84c5" stroke-width="1" opacity="1" data-chromatic-key="10" data-note="A♯" data-key-color="black" data-active="false"/><text x="612" y="231" fill="#ff84c5" font-size="14" text-anchor="middle" opacity="1" style="text-anchor: middle;">A♯</text><path d="M395.52,160 L395.52,152 L459.48,152 L459.48,160" fill="none" stroke="#ff84c5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="1" data-black-key-group="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/><text x="427.5" y="129" fill="#ff84c5" font-size="25" text-anchor="middle" opacity="1" style="text-anchor: middle;">2</text><path d="M518.52,160 L518.52,152 L623.48,152 L623.48,160" fill="none" stroke="#ff84c5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="1" data-black-key-group="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/>