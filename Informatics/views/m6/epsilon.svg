<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img"><title>Epsilon — null</title><desc>M6 cannot supply 9.</desc><text x="400" y="280" font-family="Arial, sans-serif" font-size="20" fill="#7d8d99" text-anchor="middle" dominant-baseline="central">M6 / P24</text><text x="400" y="365" font-family="Arial, sans-serif" font-size="30" fill="#e2e8ec" text-anchor="middle" dominant-baseline="central">Epsilon — null</text><text x="400" y="420" font-family="Arial, sans-serif" font-size="18" fill="#7d8d99" text-anchor="middle" dominant-baseline="central">Requires 3, 6 and 9; M6 cannot supply 9.</text></svg>
